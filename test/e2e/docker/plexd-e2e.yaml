# Minimal plexd config for Docker E2E tests.
# The --api flag overrides api.base_url at the CLI level.
# PLEXD_BOOTSTRAP_TOKEN env var provides the token via registration.token_env.
api:
  base_url: http://mock-api:8080

registration:
  data_dir: /var/lib/plexd

node_api:
  data_dir: /var/lib/plexd

heartbeat:
  node_id: e2e-node-1

wireguard:
  interface_name: wg-plexd
  listen_port: 51820

nat:
  enabled: true
  refresh_interval: 30s
  timeout: 5s

policy:
  chain_name: plexd-policy

tunnel:
  enabled: true
  max_sessions: 10
  default_timeout: 30m
  ssh_listen_addr: ":2222"

metrics:
  enabled: true
  collect_interval: 5s
  report_interval: 10s

log_fwd:
  enabled: true
  collect_interval: 5s
  report_interval: 10s
  file_patterns:
    - "/var/log/plexd/*.log"

audit_fwd:
  enabled: true
  collect_interval: 5s
  report_interval: 10s
