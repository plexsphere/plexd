# Minimal plexd config for Docker E2E tests.
# The --api flag overrides api.base_url at the CLI level.
# PLEXD_BOOTSTRAP_TOKEN env var provides the token via registration.token_env.
api:
  base_url: http://mock-api:8080

registration:
  data_dir: /var/lib/plexd
  project_id: 0190a8b8-a0c0-7a0a-8a0a-a0a0a0a0a0a0
  resource_handle: e2e-node-1

node_api:
  data_dir: /var/lib/plexd
  http_token_file: /etc/plexd/nodeapi-token

heartbeat:
  node_id: e2e-node-1

wireguard:
  interface_name: wg-plexd
  listen_port: 51820

nat:
  enabled: true
  refresh_interval: 30s
  timeout: 5s

policy:
  chain_name: plexd-policy

tunnel:
  enabled: true
  max_sessions: 10
  default_timeout: 30m
  ssh_listen_addr: ":2222"

metrics:
  enabled: true
  collect_interval: 5s
  report_interval: 10s
  local_endpoint:
    url: https://mock-api:8443/local/metrics
    secret_key: local-bearer-token
    tls_insecure_skip_verify: true

log_fwd:
  enabled: true
  collect_interval: 5s
  report_interval: 10s
  file_patterns:
    - "/var/log/plexd/*.log"
  local_endpoint:
    url: https://mock-api:8443/local/logs
    secret_key: local-bearer-token
    tls_insecure_skip_verify: true

audit_fwd:
  enabled: true
  collect_interval: 5s
  report_interval: 10s
  local_endpoint:
    url: https://mock-api:8443/local/audit
    secret_key: local-bearer-token
    tls_insecure_skip_verify: true
