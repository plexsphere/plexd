services:
  mock-api:
    build:
      context: ../..
      dockerfile: test/e2e/mockapi/Dockerfile
    # -dns-addr :53 starts the DNS stub phase 12d forwards to. The image runs
    # as uid 65534, and Docker sets net.ipv4.ip_unprivileged_port_start to 0
    # in the container, so port 53 binds.
    command: ["-addr", ":8080", "-dns-addr", ":53"]
    ports:
      - "18080:8080"
      - "18443:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mockapi", "-check", "http://localhost:8080/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - e2e-net

  plexd:
    build:
      context: ../..
      dockerfile: test/e2e/docker/Dockerfile.plexd
    # Run as root with NET_ADMIN so WireGuard (netlink), nftables, and tunnel
    # subsystems can create interfaces and firewall rules inside the container.
    user: "0:0"
    cap_add:
      - NET_ADMIN
    command: ["up", "--api", "http://mock-api:8080", "--config", "/etc/plexd/config.yaml"]
    ports:
      - "19100:9100"
    environment:
      PLEXD_BOOTSTRAP_TOKEN: psb_test_e2eproject_node_e2ee2ee2ee2ee2ee2ee2e22
      PLEXD_NODE_API_HTTP_ENABLED: "true"
      PLEXD_NODE_API_HTTP_LISTEN: "0.0.0.0:9100"
    volumes:
      - ./docker/plexd-e2e.yaml:/etc/plexd/config.yaml:ro
      - ./docker/nodeapi-token:/etc/plexd/nodeapi-token:ro
      # /etc/plexd/hooks is not mounted: the image ships the hook fixture. A
      # running test adds hooks, and a bind mount would leave root-owned files
      # in the repository.
      #
      # The data dir is a volume, not a tmpfs, so it survives `dc restart plexd`
      # the way /var/lib/plexd survives a reboot: the restarted agent resumes the
      # identity it persisted instead of registering again. `dc down -v`
      # removes it.
      - /var/lib/plexd
    tmpfs:
      - /var/run/plexd
    depends_on:
      mock-api:
        condition: service_healthy
    networks:
      - e2e-net

  # The WireGuard peer phase 12e probes plexd's policy enforcement from. It
  # stands in for the state fixture's peer ...a0b2 at mesh IP 10.99.0.3, and
  # NET_ADMIN lets it create its wg0. It publishes no port: it reaches plexd,
  # and plexd reaches it, on e2e-net. The init forwards SIGTERM to sleep, so
  # `dc down` does not wait out the stop timeout.
  meshpeer:
    build:
      context: ./meshpeer
    cap_add:
      - NET_ADMIN
    init: true
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge
