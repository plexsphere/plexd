services:
  mock-api:
    build:
      context: ../..
      dockerfile: test/e2e/mockapi/Dockerfile
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mockapi", "-check", "http://localhost:8080/v1/ping"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - e2e-net

  plexd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    # Run as root with NET_ADMIN so WireGuard (netlink), nftables, and tunnel
    # subsystems can create interfaces and firewall rules inside the container.
    user: "0:0"
    cap_add:
      - NET_ADMIN
    command: ["up", "--api", "http://mock-api:8080", "--config", "/etc/plexd/config.yaml"]
    environment:
      PLEXD_BOOTSTRAP_TOKEN: e2e-test-token
    volumes:
      - ./docker/plexd-e2e.yaml:/etc/plexd/config.yaml:ro
    tmpfs:
      - /var/lib/plexd
      - /var/run/plexd
    depends_on:
      mock-api:
        condition: service_healthy
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge
