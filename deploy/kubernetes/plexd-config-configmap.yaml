apiVersion: v1
kind: ConfigMap
metadata:
  name: plexd-config
  namespace: plexd-system
  labels:
    app.kubernetes.io/name: plexd
    app.kubernetes.io/part-of: plexsphere
data:
  config.yaml: |
    api:
      base_url: "https://api.plexsphere.com"
    log_level: info
    mode: node
    data_dir: /var/lib/plexd

    wireguard:
      interface_name: plexd0
      listen_port: 51820

    reconcile:
      interval: 60s

    policy:
      enabled: true
      chain_name: plexd-mesh

    # The health listener serves the DaemonSet's liveness/readiness probes.
    # The address must match the probe host and port in daemonset.yaml. It is
    # loopback because the endpoints are unauthenticated: under
    # hostNetwork: true a wildcard bind would answer on every node NIC and, once
    # the mesh is up, to every WireGuard peer.
    health:
      enabled: true
      listen: "127.0.0.1:9101"
