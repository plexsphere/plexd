apiVersion: v1
kind: ConfigMap
metadata:
  name: plexd-config
  namespace: plexd-system
  labels:
    app.kubernetes.io/name: plexd
    app.kubernetes.io/part-of: plexsphere
data:
  config.yaml: |
    api:
      base_url: "https://api.plexsphere.com"
    log_level: info
    mode: node
    data_dir: /var/lib/plexd

    wireguard:
      interface_name: plexd0
      listen_port: 51820

    reconcile:
      interval: 60s

    policy:
      enabled: true
      chain_name: plexd-mesh
