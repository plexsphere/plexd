apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plexdhooks.plexd.plexsphere.com
  labels:
    app.kubernetes.io/name: plexd
    app.kubernetes.io/part-of: plexsphere
spec:
  group: plexd.plexsphere.com
  names:
    kind: PlexdHook
    listKind: PlexdHookList
    plural: plexdhooks
    singular: plexdhook
    shortNames:
      - ph
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - hookName
              properties:
                hookName:
                  type: string
                  minLength: 1
                jobTemplate:
                  type: object
                  properties:
                    image:
                      type: string
                      minLength: 1
                    command:
                      type: array
                      items:
                        type: string
                    args:
                      type: array
                      items:
                        type: string
                parameters:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                        minLength: 1
                      value:
                        type: string
                privileged:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                jobName:
                  type: string
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                message:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Hook Name
          type: string
          jsonPath: .spec.hookName
        - name: Privileged
          type: boolean
          jsonPath: .spec.privileged
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
