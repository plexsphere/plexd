<svg xmlns="http://www.w3.org/2000/svg" width="1185" height="700" viewBox="0 0 1185 700" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="States of the SSE connection">
<title>States of the SSE connection</title>
<rect width="1185" height="700" fill="#F6F5F1"/>
<rect x="40" y="242" width="950" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="515" y="277" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">Connecting</text>
<rect x="395" y="122" width="240" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="515" y="157" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">Disconnected</text>
<ellipse cx="515" cy="52" rx="9" ry="9" fill="#17202B"/>
<polyline points="515,61 515,113" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="515,122 509,109 521,109" fill="#3A4452"/>
<polyline points="515,178 515,233" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="515,242 509,229 521,229" fill="#3A4452"/>
<rect x="740" y="122" width="180" height="56" rx="6" fill="#F8E8E9" stroke="#C6343C" stroke-width="2"/>
<text x="830" y="157" font-size="20" font-weight="700" fill="#A3262E" text-anchor="middle">Stopped</text>
<polyline points="830,242 830,187" fill="none" stroke="#C6343C" stroke-width="2.5"/>
<polygon points="830,178 836,191 824,191" fill="#C6343C"/>
<text x="840" y="215.95" font-size="17" fill="#55606E">403 or 404</text>
<ellipse cx="830" cy="52" rx="12" ry="12" fill="#F6F5F1" stroke="#17202B" stroke-width="2"/>
<ellipse cx="830" cy="52" rx="7" ry="7" fill="#17202B"/>
<polyline points="830,122 830,73" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="830,64 836,77 824,77" fill="#3A4452"/>
<rect x="50" y="428" width="180" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="140" y="463" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">Connected</text>
<rect x="390" y="428" width="180" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="480" y="463" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">PullOnly</text>
<rect x="770" y="428" width="180" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="860" y="463" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">Backoff</text>
<polyline points="126,298 126,419" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="126,428 120,415 132,415" fill="#3A4452"/>
<polyline points="154,428 154,307" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="154,298 160,311 148,311" fill="#3A4452"/>
<text x="164" y="358.75" font-size="17" fill="#55606E">connection</text>
<text x="164" y="379.15" font-size="17" fill="#55606E">dropped</text>
<polyline points="466,298 466,419" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="466,428 460,415 472,415" fill="#3A4452"/>
<polyline points="494,428 494,307" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="494,298 500,311 488,311" fill="#3A4452"/>
<text x="456" y="368.95" font-size="17" fill="#55606E" text-anchor="end">501 descope</text>
<text x="504" y="359.35" font-size="17" fill="#55606E">re-probe, every</text>
<text x="504" y="378.8" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E">SSEReprobeInterval</text>
<polyline points="846,298 846,419" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="846,428 840,415 852,415" fill="#3A4452"/>
<polyline points="874,428 874,307" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="874,298 880,311 868,311" fill="#3A4452"/>
<text x="836" y="358.75" font-size="17" fill="#55606E" text-anchor="end">transient error</text>
<text x="836" y="379.15" font-size="17" fill="#55606E" text-anchor="end">or 401</text>
<text x="884" y="368.95" font-size="17" fill="#55606E">delay elapsed</text>
<rect x="770" y="604" width="180" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="860" y="639" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">Polling</text>
<polyline points="860,484 860,595" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="860,604 854,591 866,591" fill="#3A4452"/>
<text x="850" y="539.75" font-size="17" fill="#55606E" text-anchor="end">threshold exceeded</text>
<text x="850" y="560.15" font-size="17" fill="#55606E" text-anchor="end">(5 min)</text>
<polyline points="950,632 1050,632 1050,270 999,270" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="990,270 1003,264 1003,276" fill="#3A4452"/>
<text x="1060" y="539.75" font-size="17" fill="#55606E">periodic</text>
<text x="1060" y="560.15" font-size="17" fill="#55606E">SSE retry</text>
</svg>
