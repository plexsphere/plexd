<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="631" viewBox="0 0 1060 631" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Lifecycle of a hook execution">
<title>Lifecycle of a hook execution</title>
