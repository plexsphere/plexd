<text x="932.5" y="411.4" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">10.100.1.250</text>
<text x="932.5" y="431.55" font-size="17" fill="#55606E" text-anchor="middle">NAT relay</text>
<rect x="40" y="410" width="625" height="126" rx="8" fill="#E6F1EA" stroke="#2F8A57" stroke-width="2"/>
<text x="54" y="439" font-size="20" font-weight="700" fill="#1E6B40">Encrypted WireGuard mesh, full mesh</text>
<text x="54" y="460.15" font-size="17" fill="#55606E">Every node has a direct peer-to-peer tunnel to every</text>
<text x="54" y="480.55" font-size="17" fill="#55606E">node. Each peer uses STUN to discover its public</text>
<text x="54" y="500.95" font-size="17" fill="#55606E">endpoint for NAT traversal. Falls back to relay via</text>
<text x="54" y="521.35" font-size="17" fill="#55606E">the bridge when direct connectivity fails.</text>
