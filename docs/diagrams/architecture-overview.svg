<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="730" viewBox="0 0 1180 730" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="High-level overview of a plexd deployment">
