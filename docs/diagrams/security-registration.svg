<svg xmlns="http://www.w3.org/2000/svg" width="993" height="718" viewBox="0 0 993 718" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Registration: only the public key leaves the node">
<title>Registration: only the public key leaves the node</title>
<rect width="993" height="718" fill="#F6F5F1"/>
<rect x="40" y="40" width="102" height="64" rx="8" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<text x="91" y="69.4" font-size="20" font-weight="700" fill="#1E6B40" text-anchor="middle">Client</text>
<text x="91" y="89.6" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">plexd</text>
<rect x="516.5" y="40" width="189" height="64" rx="8" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="611" y="79" font-size="20" font-weight="700" fill="#1D47A6" text-anchor="middle">Control Plane</text>
<polyline points="91,104 91,677.4" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<polyline points="611,104 611,677.4" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<polyline points="91,132 127,132 127,160 100,160" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="91,160 104,154 104,166" fill="#3A4452"/>
<text x="137" y="151.95" font-size="17" fill="#55606E">Generate Curve25519 keypair</text>
<text x="351" y="197.3" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">POST /v1/register</text>
<text x="351" y="216.5" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">{project_id, resource_handle,</text>
<text x="351" y="235.7" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">bootstrap_token, nonce, public_key,</text>
<text x="351" y="254.9" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">requested_resource_id (optional)}</text>
<polyline points="91,265 602,265" fill="none" stroke="#2457C5" stroke-width="2.5"/>
<polygon points="611,265 598,271 598,259" fill="#2457C5"/>
<polyline points="611,289 647,289 647,329.8 620,329.8" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="611,329.8 624,323.8 624,335.8" fill="#3A4452"/>
<text x="657" y="305.15" font-size="17" fill="#55606E">Validate token (redemption under</text>
<text x="657" y="325.55" font-size="17" fill="#55606E">its BootstrapToken policy)</text>
<polyline points="611,355.8 647,355.8 647,396.6 620,396.6" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="611,396.6 624,390.6 624,402.6" fill="#3A4452"/>
<text x="657" y="371.95" font-size="17" fill="#55606E">Assign mesh IP from the</text>
<text x="657" y="392.35" font-size="17" fill="#55606E">Domain mesh CIDR</text>
<polyline points="611,422.6 647,422.6 647,450.6 620,450.6" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="611,450.6 624,444.6 624,456.6" fill="#3A4452"/>
<text x="657" y="442.55" font-size="17" fill="#55606E">Store public key</text>
<polyline points="611,476.6 647,476.6 647,504.6 620,504.6" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="611,504.6 624,498.6 624,510.6" fill="#3A4452"/>
<text x="657" y="496.55" font-size="17" fill="#55606E">Generate Node Secret Key (NSK)</text>
<text x="351" y="542" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">{node_id, mesh_ip, signing_public_key,</text>
<text x="351" y="561.2" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">signing_key_id, nsk, peer_snapshot,</text>
<text x="351" y="580.4" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">domain_mesh_cidr}</text>
<polyline points="611,590.6 100,590.6" fill="none" stroke="#B0387F" stroke-width="2.5"/>
<polygon points="91,590.6 104,584.6 104,596.6" fill="#B0387F"/>
<polyline points="91,614.6 127,614.6 127,655.4 100,655.4" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="91,655.4 104,649.4 104,661.4" fill="#3A4452"/>
<text x="137" y="630.75" font-size="17" fill="#55606E">Build the bearer envelope from</text>
<text x="137" y="651.15" font-size="17" fill="#55606E">node ID and NSK, set it as auth token</text>
</svg>
