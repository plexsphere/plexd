<svg xmlns="http://www.w3.org/2000/svg" width="993" height="708" viewBox="0 0 993 708" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Registration: only the public key leaves the node">
<title>Registration: only the public key leaves the node</title>
