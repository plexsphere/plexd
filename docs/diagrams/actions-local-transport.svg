<svg xmlns="http://www.w3.org/2000/svg" width="1089" height="590" viewBox="0 0 1089 590" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="plexd actions run through the node API socket">
<title>plexd actions run through the node API socket</title>
<rect width="1089" height="590" fill="#F6F5F1"/>
<rect x="182" y="210" width="867" height="229" rx="12" fill="#E6F1EA" stroke="#2F8A57" stroke-width="2"/>
<text x="198" y="243.2" font-size="22" font-weight="700" fill="#2B3440">plexd daemon</text>
<rect x="292" y="314" width="298" height="61" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="441" y="340.25" font-size="17" font-weight="700" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#2B3440" text-anchor="middle">handleRunAction</text>
<text x="441" y="360.65" font-size="17" fill="#55606E" text-anchor="middle">decode action and parameters</text>
<rect x="660" y="280" width="359" height="129" rx="6" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<polyline points="660,321 1019,321" fill="none" stroke="#2F8A57" stroke-width="1.5"/>
<text x="674" y="306.45" font-size="17" font-weight="700" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1E6B40">Executor.RunLocal</text>
<text x="674" y="344.95" font-size="17" font-weight="700" fill="#1E6B40">1</text>
<text x="699.83" y="344.95" font-size="17" fill="#2B3440">actions.enabled is false</text>
<text x="911.79" y="344.95" font-size="17" fill="#7D8794">→</text>
<text x="943.07" y="344.95" font-size="17" fill="#2B3440">refuse</text>
<text x="674" y="370.95" font-size="17" font-weight="700" fill="#1E6B40">2</text>
<text x="699.83" y="370.95" font-size="17" fill="#2B3440">not a registered built-in</text>
<text x="911.79" y="370.95" font-size="17" fill="#7D8794">→</text>
<text x="943.07" y="370.95" font-size="17" fill="#2B3440">refuse</text>
<text x="674" y="396.95" font-size="17" font-weight="700" fill="#1E6B40">3</text>
<text x="699.83" y="396.95" font-size="17" fill="#2B3440">run the built-in</text>
<polyline points="590,344.5 651,344.5" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="660,344.5 647,350.5 647,338.5" fill="#3A4452"/>
<rect x="186.5" y="40" width="509" height="60" rx="4" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="441" y="66.35" font-size="17" font-weight="700" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#2B3440" text-anchor="middle">plexd actions run</text>
<text x="441" y="85.8" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">diagnostics.collect --param include_network=false</text>
<polyline points="401,100 401,305" fill="none" stroke="#2457C5" stroke-width="2.5"/>
<polygon points="401,314 395,301 407,301" fill="#2457C5"/>
<text x="391" y="151.35" font-size="17" fill="#55606E" text-anchor="end">node API socket, root or the plexd group</text>
<text x="391" y="170.8" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="end">/var/run/plexd/api.sock</text>
<polyline points="481,314 481,100" fill="none" stroke="#3A4452" stroke-width="2.5" stroke-dasharray="7.5 5"/>
<polyline points="487,113 481,100 475,113" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<text x="491" y="160.95" font-size="17" fill="#55606E">status, exit_code, stdout, stderr</text>
<rect x="660" y="489" width="321" height="61" rx="4" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="674" y="515.15" font-size="17" fill="#55606E">no execution id, no callback:</text>
<text x="674" y="535.55" font-size="17" fill="#55606E">nothing reaches the control plane</text>
<polyline points="839.5,439 839.5,489" fill="none" stroke="#7D8794" stroke-width="2.5"/>
</svg>
