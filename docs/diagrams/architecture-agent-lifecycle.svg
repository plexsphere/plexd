<rect x="440" y="194.8" width="704" height="382" rx="12" fill="#E6F1EA" stroke="#2F8A57" stroke-width="2"/>
<text x="456" y="228" font-size="22" font-weight="700" fill="#2B3440">Connected</text>
<text x="606" y="226.25" font-size="17" fill="#55606E">steady state</text>
<polyline points="1045.5,124.8 1045.5,185.8" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="1045.5,194.8 1039.5,181.8 1051.5,181.8" fill="#3A4452"/>
