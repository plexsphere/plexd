<rect x="800" y="254.8" width="320" height="50" rx="8" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<text x="960" y="286.8" font-size="20" font-weight="700" fill="#1E6B40" text-anchor="middle">NAT refresh</text>
