<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="864" viewBox="0 0 1220 864" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="An action run from a mediated SSH session">
<title>An action run from a mediated SSH session</title>
<rect width="1220" height="864" fill="#F6F5F1"/>
<rect x="40" y="40" width="88" height="65" rx="8" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="84" y="79.5" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">User</text>
<rect x="440" y="40" width="148" height="65" rx="8" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="514" y="69.3" font-size="20" font-weight="700" fill="#1D47A6" text-anchor="middle">Platform</text>
<text x="514" y="90.45" font-size="17" fill="#55606E" text-anchor="middle">control plane</text>
<rect x="825" y="40" width="138" height="65" rx="8" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<text x="894" y="69.3" font-size="20" font-weight="700" fill="#1E6B40" text-anchor="middle">plexd</text>
<text x="894" y="90.45" font-size="17" fill="#55606E" text-anchor="middle">target Node</text>
<polyline points="84,105 84,823.2" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<polyline points="514,105 514,823.2" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<polyline points="894,105 894,823.2" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<text x="299" y="145.45" font-size="17" fill="#55606E" text-anchor="middle">request an SSH session</text>
<polyline points="84,156 505,156" fill="none" stroke="#2457C5" stroke-width="2.5"/>
<polygon points="514,156 501,162 501,150" fill="#2457C5"/>
<polyline points="514,180 550,180 550,219.6 523,219.6" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="514,219.6 527,213.6 527,225.6" fill="#3A4452"/>
<text x="560" y="196.15" font-size="17" fill="#55606E">issue the session token</text>
<text x="560" y="215.6" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E">{ jti, target.user, exp }</text>
<text x="704" y="257.85" font-size="17" fill="#55606E" text-anchor="middle">the session, in the state</text>
<text x="704" y="278.25" font-size="17" fill="#55606E" text-anchor="middle">pull's sessions block</text>
<polyline points="514,288.6 894,288.6" fill="none" stroke="#3A4452" stroke-width="2.5" stroke-dasharray="7.5 5"/>
<polyline points="881,294.6 894,288.6 881,282.6" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<text x="299" y="325.05" font-size="17" fill="#55606E" text-anchor="middle">SSH login, the token as password</text>
<polyline points="93,335.6 885,335.6" fill="none" stroke="#2F8A57" stroke-width="2.5"/>
<polygon points="894,335.6 881,341.6 881,329.6" fill="#2F8A57"/>
<polygon points="84,335.6 97,329.6 97,341.6" fill="#2F8A57"/>
<polyline points="894,359.6 930,359.6 930,400.4 903,400.4" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="894,400.4 907,394.4 907,406.4" fill="#3A4452"/>
<text x="940" y="375.75" font-size="17" fill="#55606E">verify the token:</text>
<text x="940" y="396.15" font-size="17" fill="#55606E">signature, jti, user, exp</text>
<polyline points="894,426.4 930,426.4 930,454.4 903,454.4" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="894,454.4 907,448.4 907,460.4" fill="#3A4452"/>
<text x="940" y="446.35" font-size="17" fill="#55606E">start the user's shell</text>
<text x="299" y="492" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">plexd actions run diagnostics.collect</text>
<polyline points="84,502.4 885,502.4" fill="none" stroke="#2457C5" stroke-width="2.5"/>
<polygon points="894,502.4 881,508.4 881,496.4" fill="#2457C5"/>
<polyline points="894,526.4 930,526.4 930,567.2 903,567.2" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="894,567.2 907,561.2 907,573.2" fill="#3A4452"/>
<text x="940" y="542.55" font-size="17" fill="#55606E">open the node API socket:</text>
<text x="940" y="562.95" font-size="17" fill="#55606E">root or the plexd group</text>
<polyline points="894,593.2 930,593.2 930,621.2 903,621.2" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="894,621.2 907,615.2 907,627.2" fill="#3A4452"/>
<text x="940" y="613.15" font-size="17" fill="#55606E">actions enabled? a built-in?</text>
<polyline points="894,647.2 930,647.2 930,675.2 903,675.2" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="894,675.2 907,669.2 907,681.2" fill="#3A4452"/>
<text x="940" y="667.15" font-size="17" fill="#55606E">run the built-in</text>
<text x="704" y="713.65" font-size="17" fill="#55606E" text-anchor="middle">result</text>
<polyline points="894,724.2 84,724.2" fill="none" stroke="#3A4452" stroke-width="2.5" stroke-dasharray="7.5 5"/>
<polyline points="97,718.2 84,724.2 97,730.2" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<rect x="910" y="744.2" width="200" height="61" rx="8" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="924" y="770.35" font-size="17" fill="#55606E">nothing is reported</text>
<text x="924" y="790.75" font-size="17" fill="#55606E">to the control plane</text>
</svg>
