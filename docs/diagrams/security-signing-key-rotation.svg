<svg xmlns="http://www.w3.org/2000/svg" width="882" height="493" viewBox="0 0 882 493" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Picking up a rotated signing key from the state pull">
<title>Picking up a rotated signing key from the state pull</title>
<rect width="882" height="493" fill="#F6F5F1"/>
<rect x="40" y="40" width="102" height="64" rx="8" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<text x="91" y="69.4" font-size="20" font-weight="700" fill="#1E6B40" text-anchor="middle">Client</text>
<text x="91" y="89.6" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">plexd</text>
<rect x="516.5" y="40" width="189" height="64" rx="8" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="611" y="79" font-size="20" font-weight="700" fill="#1D47A6" text-anchor="middle">Control Plane</text>
<polyline points="91,104 91,452.6" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<polyline points="611,104 611,452.6" fill="none" stroke="#7D8794" stroke-width="1.5" stroke-dasharray="6 4.5"/>
<rect x="627" y="128" width="215" height="61" rx="8" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="641" y="154.15" font-size="17" fill="#55606E">Operator rotates the</text>
<text x="641" y="174.55" font-size="17" fill="#55606E">Domain's signing key</text>
<text x="351" y="222.4" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">GET /v1/nodes/{node_id}/state</text>
<text x="351" y="242.55" font-size="17" fill="#55606E" text-anchor="middle">(reconcile)</text>
<polyline points="91,253 602,253" fill="none" stroke="#2457C5" stroke-width="2.5"/>
<polygon points="611,253 598,259 598,247" fill="#2457C5"/>
<text x="351" y="288.6" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">{..., signing_key: {key_id, public_key}}</text>
<polyline points="611,299 91,299" fill="none" stroke="#3A4452" stroke-width="2.5" stroke-dasharray="7.5 5"/>
<polyline points="104,293 91,299 104,305" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polyline points="91,323 127,323 127,363.8 100,363.8" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="91,363.8 104,357.8 104,369.8" fill="#3A4452"/>
<text x="137" y="339.15" font-size="17" fill="#55606E">Install as the only trusted key</text>
<text x="137" y="359.55" font-size="17" fill="#55606E">(no grace window)</text>
<polyline points="91,389.8 127,389.8 127,430.6 100,430.6" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="91,430.6 104,424.6 104,436.6" fill="#3A4452"/>
<text x="137" y="405.95" font-size="17" fill="#55606E">Persist to signing_public_key</text>
<text x="137" y="426.35" font-size="17" fill="#55606E">and identity.json</text>
</svg>
