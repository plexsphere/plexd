<text x="180" y="89.6" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">GET /v1/nodes/{id}/state</text>
<rect x="40" y="210" width="280" height="64" rx="8" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<text x="180" y="249" font-size="20" font-weight="700" fill="#1E6B40" text-anchor="middle">Reconciler</text>
