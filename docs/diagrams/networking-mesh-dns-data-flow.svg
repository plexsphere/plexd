<polygon points="130,104 136,117 124,117" fill="#2457C5"/>
<polyline points="230,104 230,210" fill="none" stroke="#3A4452" stroke-width="2.5" stroke-dasharray="7.5 5"/>
<polyline points="224,197 230,210 236,197" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<text x="240" y="162.95" font-size="17" fill="#55606E">dns block</text>
<rect x="420" y="210" width="260" height="64" rx="8" fill="#FDFCF9" stroke="#2F8A57" stroke-width="2"/>
<text x="550" y="238.35" font-size="17" font-weight="700" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1E6B40" text-anchor="middle">meshdns.Manager</text>
<text x="550" y="257.8" font-size="16" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#55606E" text-anchor="middle">Handle</text>
<polyline points="320,242 411,242" fill="none" stroke="#3A4452" stroke-width="2.5"/>
<polygon points="420,242 407,248 407,236" fill="#3A4452"/>
