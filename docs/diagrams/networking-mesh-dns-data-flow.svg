<text x="180" y="420.55" font-size="17" fill="#55606E" text-anchor="middle">mesh IP:5354 on Linux</text>
<text x="180" y="440.95" font-size="17" fill="#55606E" text-anchor="middle">127.0.0.1:5354 on macOS</text>
<text x="180" y="461.35" font-size="17" fill="#55606E" text-anchor="middle">127.0.0.1:53 on Windows</text>
