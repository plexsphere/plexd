<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1023" viewBox="0 0 1130 1023" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="From the dns block to the mesh DNS resolver">
<title>From the dns block to the mesh DNS resolver</title>
<rect width="1130" height="1023" fill="#F6F5F1"/>
<rect x="40" y="40" width="280" height="64" rx="8" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
