<text x="650" y="662.75" font-size="17" font-weight="700" font-family="'IBM Plex Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1E6B40" text-anchor="middle">CommandExecutor</text>
<text x="650" y="683.15" font-size="17" fill="#55606E" text-anchor="middle">swanctl, openvpn</text>
