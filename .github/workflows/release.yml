name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
          - goarch: mipsle
            gomips: softfloat
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::8} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o plexd-linux-${{ matrix.goarch }} \
            ./cmd/plexd

      - name: Generate checksum
        run: sha256sum plexd-linux-${{ matrix.goarch }} > plexd-linux-${{ matrix.goarch }}.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plexd-linux-${{ matrix.goarch }}
          path: |
            plexd-linux-${{ matrix.goarch }}
            plexd-linux-${{ matrix.goarch }}.sha256
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Generate combined checksums
        run: cat plexd-linux-*.sha256 > checksums.sha256

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release binaries
        run: |
          for arch in amd64 arm64 mipsle; do
            cosign sign-blob --yes --bundle "plexd-linux-${arch}.sigstore.json" "plexd-linux-${arch}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          generate_release_notes: true
          files: |
            plexd-linux-amd64
            plexd-linux-arm64
            plexd-linux-mipsle
            plexd-linux-amd64.sigstore.json
            plexd-linux-arm64.sigstore.json
            plexd-linux-mipsle.sigstore.json
            checksums.sha256
