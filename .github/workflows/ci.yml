name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  unit-test:
    runs-on: ${{ matrix.os }}
    # No measured Windows duration exists yet; the Linux job takes about a
    # minute and a half, and a race-instrumented run on the Windows runner is
    # expected to take several times that.
    timeout-minutes: 30
    strategy:
      # A Windows failure must not cancel the Linux and macOS jobs: their logs
      # are what tell you whether the failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run unit tests
        run: go test -race -count=1 ./...

      # Creating network namespaces and loading nftables rules need root, so
      # the Linux test against the real kernel skips in the unprivileged run
      # above. It builds its three namespaces and their links itself and leaves
      # the runner's own links and ruleset alone. It also asks for
      # PLEXD_TEST_REAL_NFTABLES, so sudo go test ./... on a developer's machine
      # creates nothing unasked. The absolute go path is resolved before sudo
      # resets PATH, and the two cache variables let root reuse what the step
      # above downloaded and built. The step fails unless the test passed: a
      # skip would pass as well otherwise, so it greps the -v output for the
      # PASS line.
      - name: Run privileged Linux tests
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" PLEXD_TEST_REAL_NFTABLES=1 \
            "$(command -v go)" test -race -count=1 -v -run '^TestNftablesController_Real$' ./internal/policy/ \
            | tee "$RUNNER_TEMP/real-nftables.txt"
          grep -q -- '--- PASS: TestNftablesController_Real' "$RUNNER_TEMP/real-nftables.txt"

      # Creating a utun device needs root, and so do altering the routing table
      # and the forwarding sysctl, so the four macOS tests against the real
      # kernel skip in the unprivileged run above. The bridge controller test
      # creates its utuns through the bridge controllers and routes over them.
      # Loading a pf anchor and taking a pf enable reference need root as well;
      # that test also asks for PLEXD_TEST_REAL_PF, so sudo go test ./... on a
      # developer's Mac leaves the host's pf alone. The absolute go path is
      # resolved before sudo resets PATH, and the two cache variables let root
      # reuse what the step above downloaded and built instead of filling a
      # second cache under /var/root. -v is what makes a skip visible in the log
      # rather than passing as a bare ok. The two session helper tests start a
      # shell as uid 65534 and hand it the pty, which needs root as well; they
      # skip on every other runner, so this is where the switch of users is
      # exercised. The mesh DNS registrar test writes configd's dynamic store
      # and resolves through mDNSResponder over a real utun, which changes the
      # host's resolver configuration while it runs; it also asks for
      # PLEXD_TEST_REAL_RESOLVER, so sudo go test ./... on a developer's Mac
      # leaves their resolver alone.
      - name: Run privileged macOS tests
        if: runner.os == 'macOS'
        run: |
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            PLEXD_TEST_REAL_PF=1 PLEXD_TEST_REAL_RESOLVER=1 \
            "$(command -v go)" test -race -count=1 -v \
            -run '^(TestDarwinController_RealUTUN|TestDarwinRouteController_Real|TestPFController_Real|TestWGControllers_RealUTUN|TestSessionHelper_PTYBelongsToLoginUser|TestSessionHelper_RefusedPTYKeepsItsOwner|TestScutilRegistrar_Real)$' \
            ./internal/wireguard/ ./internal/bridge/ ./internal/policy/ ./internal/tunnel/ ./internal/meshdns/

      # Creating a Wintun adapter needs the driver DLL and Administrator. The
      # Windows runner is already elevated, so the gate is this variable rather
      # than the privilege check: without one the two tests, the controller's
      # own and the bridge controllers', would also run inside the ordinary step
      # above and create real adapters there. The tests write the embedded
      # wintun.dll beside their own binaries, so nothing has to be fetched.
      - name: Run real Wintun tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WINTUN: '1'
        run: >-
          go test -race -count=1 -v
          -run '^(TestWindowsController_RealWintun|TestWGControllers_RealWintun)$' ./internal/wireguard/ ./internal/bridge/

      # Adding a route and toggling an adapter's forwarding flag need
      # Administrator. The runner has it, so the gate is this variable for the
      # same reason as above: without one the test would alter the runner's
      # routing table from inside the ordinary step.
      - name: Run real route tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_ROUTES: '1'
        run: >-
          go test -race -count=1 -v
          -run '^TestWindowsRouteController_Real$' ./internal/bridge/

      # Programming the filter engine and creating a NetNat object need
      # Administrator. The runner has it, so the gate is this variable for the
      # same reason as above: without one the tests would install real filters
      # inside the ordinary step. The NAT test uses a prefix no adapter carries.
      - name: Run real WFP tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WFP: '1'
        run: >-
          go test -race -count=1 -v
          -run '^TestWFPController_Real(NAT)?$' ./internal/policy/

      # The mesh DNS registrar test writes Name Resolution Policy Table rules,
      # the search list of a Wintun adapter and the Group Policy key, refreshes
      # machine policy and binds 127.0.0.1:53, which changes the runner's
      # resolver configuration while it runs. The runner has Administrator, so
      # the gate is this variable for the same reason as above: without one the
      # test would do all that inside the ordinary step. It waits up to 180
      # seconds each time the Group Policy store decides, so its timeout is
      # above go test's default of 10 minutes. It runs as LocalSystem, as
      # plexd's service does, through a scheduled task, because the DNS Client
      # reads the Group Policy store only after GenerateGPNotification, which
      # is measured to work for LocalSystem; the task does not inherit this
      # step's environment, so the variable is set in the script it runs. The
      # step prints the test's output as it grows and fails unless the test
      # passed: a skip would pass as well otherwise.
      - name: Run real resolver tests
        if: runner.os == 'Windows'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'meshdns.test.exe'
          $out = Join-Path $env:RUNNER_TEMP 'real-resolver.txt'
          $bat = Join-Path $env:RUNNER_TEMP 'real-resolver.cmd'
          go test -c -race -o $exe ./internal/meshdns/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath $bat -Encoding ascii -Value @(
            '@echo off',
            'set PLEXD_TEST_REAL_RESOLVER=1',
            "`"$exe`" -test.run=TestNRPTRegistrar_Real -test.v -test.timeout=15m > `"$out`" 2>&1",
            "echo TEST-EXIT %ERRORLEVEL% >> `"$out`""
          )
          $task = 'plexd-real-resolver-test'
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$bat`""
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          Register-ScheduledTask -TaskName $task -Action $action -Principal $principal | Out-Null
          Start-ScheduledTask -TaskName $task
          $printed = 0
          $exit = $null
          $deadline = (Get-Date).AddMinutes(17)
          while ($null -eq $exit -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $lines = @()
            try { $lines = @(Get-Content -LiteralPath $out -ErrorAction Stop) } catch { }
            if ($lines.Count -gt $printed) {
              $lines[$printed..($lines.Count - 1)] | ForEach-Object { Write-Host $_ }
              $printed = $lines.Count
            }
            $last = $lines | Where-Object { $_ -like 'TEST-EXIT *' } | Select-Object -Last 1
            if ($last) { $exit = [int](($last -replace '^TEST-EXIT', '').Trim()) }
          }
          Unregister-ScheduledTask -TaskName $task -Confirm:$false
          if ($null -eq $exit) { Write-Host 'the test did not finish within 17 minutes'; exit 1 }
          if ($exit -ne 0) { exit $exit }
          if (-not (Select-String -LiteralPath $out -SimpleMatch -Quiet -Pattern '--- PASS: TestNRPTRegistrar_Real')) {
            Write-Host 'TestNRPTRegistrar_Real did not pass'
            exit 1
          }

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run integration tests
        run: go test -race -count=1 -run Integration ./...
