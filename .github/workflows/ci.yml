name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  unit-test:
    runs-on: ${{ matrix.os }}
    # No measured Windows duration exists yet; the Linux job takes about a
    # minute and a half, and a race-instrumented run on the Windows runner is
    # expected to take several times that.
    timeout-minutes: 30
    strategy:
      # A Windows failure must not cancel the Linux and macOS jobs: their logs
      # are what tell you whether the failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run unit tests
        run: go test -race -count=1 ./...

      # Creating a utun device needs root, so the macOS WireGuard controller's
      # one test against the real kernel skips in the unprivileged run above.
      # The absolute go path is resolved before sudo resets PATH, and the two
      # cache variables let root reuse what the step above downloaded and built
      # instead of filling a second cache under /var/root. -v is what makes a
      # skip visible in the log rather than passing as a bare ok.
      - name: Run privileged macOS tests
        if: runner.os == 'macOS'
        run: |
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            "$(command -v go)" test -race -count=1 -v \
            -run '^TestDarwinController_RealUTUN$' ./internal/wireguard/

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run integration tests
        run: go test -race -count=1 -run Integration ./...
