name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  unit-test:
    runs-on: ${{ matrix.os }}
    # No measured Windows duration exists yet; the Linux job takes about a
    # minute and a half, and a race-instrumented run on the Windows runner is
    # expected to take several times that.
    timeout-minutes: 30
    strategy:
      # A Windows failure must not cancel the Linux and macOS jobs: their logs
      # are what tell you whether the failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run unit tests
        run: go test -race -count=1 ./...

      # Creating a utun device needs root, and so do altering the routing table
      # and the forwarding sysctl, so the three macOS tests against the real
      # kernel skip in the unprivileged run above. Loading a pf anchor and
      # taking a pf enable reference need root as well; that test also asks for
      # PLEXD_TEST_REAL_PF, so sudo go test ./... on a developer's Mac leaves
      # the host's pf alone. The absolute go path is resolved before sudo resets
      # PATH, and the two cache variables let root reuse what the step above
      # downloaded and built instead of filling a second cache under /var/root.
      # -v is what makes a skip visible in the log rather than passing as a bare
      # ok.
      - name: Run privileged macOS tests
        if: runner.os == 'macOS'
        run: |
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            PLEXD_TEST_REAL_PF=1 \
            "$(command -v go)" test -race -count=1 -v \
            -run '^(TestDarwinController_RealUTUN|TestDarwinRouteController_Real|TestPFController_Real)$' \
            ./internal/wireguard/ ./internal/bridge/ ./internal/policy/

      # Creating a Wintun adapter needs the driver DLL and Administrator. The
      # Windows runner is already elevated, so the gate is this variable rather
      # than the privilege check: without one the test would also run inside the
      # ordinary step above and create a real adapter there. The test writes the
      # embedded wintun.dll beside its own binary, so nothing has to be fetched.
      - name: Run real Wintun tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WINTUN: '1'
        run: >-
          go test -race -count=1 -v
          -run '^TestWindowsController_RealWintun$' ./internal/wireguard/

      # Adding a route and toggling an adapter's forwarding flag need
      # Administrator. The runner has it, so the gate is this variable for the
      # same reason as above: without one the test would alter the runner's
      # routing table from inside the ordinary step.
      - name: Run real route tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_ROUTES: '1'
        run: >-
          go test -race -count=1 -v
          -run '^TestWindowsRouteController_Real$' ./internal/bridge/

      # Programming the filter engine and creating a NetNat object need
      # Administrator. The runner has it, so the gate is this variable for the
      # same reason as above: without one the tests would install real filters
      # inside the ordinary step. The NAT test uses a prefix no adapter carries.
      - name: Run real WFP tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WFP: '1'
        run: >-
          go test -race -count=1 -v
          -run '^TestWFPController_Real(NAT)?$' ./internal/policy/

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run integration tests
        run: go test -race -count=1 -run Integration ./...
