name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  unit-test:
    runs-on: ${{ matrix.os }}
    # No measured Windows duration exists yet; the Linux job takes about a
    # minute and a half, and a race-instrumented run on the Windows runner is
    # expected to take several times that.
    timeout-minutes: 30
    strategy:
      # A Windows failure must not cancel the Linux and macOS jobs: their logs
      # are what tell you whether the failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run unit tests
        run: go test -race -count=1 ./...

      # Creating network namespaces and loading nftables rules need root, so
      # the nine Linux tests against the real kernel skip in the unprivileged
      # run above. They build their namespaces, links and TUN devices
      # themselves and leave the runner's own links and ruleset alone. The
      # traffic test TestNftablesController_RealTraffic runs the same checks
      # as the macOS and Windows ones, and the connection-log test
      # TestNftablesController_RealConnLog the same checks as the macOS one,
      # each through a TUN device in a fresh namespace. The
      # connection-log test reads what plexd's log rules send to NFLOG group
      # 28772 in that namespace. All three ask for PLEXD_TEST_REAL_NFTABLES,
      # so sudo go test ./... on a developer's machine creates nothing unasked.
      # The site-to-site link test TestNetlinkVPNController_RealLinks creates
      # an xfrm interface, a tun device and WireGuard interfaces in a
      # namespace of its own and asks for PLEXD_TEST_REAL_LINKS for the same
      # reason; it is the only proof that netlink creates the links of the
      # ipsec and openvpn tunnels as the measurement did. The route test
      # TestNetlinkRouteController_RealRoutes shares that gate and proves that
      # RemoveRoute deletes the route AddRoute added, which a peer's routed
      # subnet on the mesh interface depends on. The round-trip probe test
      # TestRTTProbe_RealAnswersOnlyTheMeshInterface shares it too and proves
      # that the probe socket answers only what arrives on the mesh
      # interface, not a mesh source spoofed from another network.
      # The tcp session test TestSession_RealAcceptsOnlyMeshAndLocal shares
      # the gate as well and proves that a session listener bound to the mesh
      # interface refuses a host on another network and still accepts the
      # mesh peer and a client on the node that dials the mesh IP from its
      # default source. The resolver test
      # TestServer_RealAnswersNoOtherNetwork shares it too and proves that the
      # mesh DNS resolver answers no query from another network; it records
      # that this protection rests on the source rule and on the kernel's
      # martian check. The address test
      # TestNetlinkController_RealReplaceAddress shares the gate too and
      # proves the order in which a changed mesh address replaces the old one
      # on a live WireGuard link: the link ends with the new address alone, a
      # route through it survives, the connected route names the new
      # source, and an observer that keeps addresses without their prefix
      # length, as systemd-resolved does, ends with the new address.
      # The absolute go path is resolved before sudo resets PATH, and the two
      # cache variables let root reuse what the step above downloaded and
      # built. The step fails unless all nine tests passed: a skip would pass
      # as well otherwise, so it greps the -v output for each PASS line. The
      # space after each name keeps one test's line from matching another's.
      - name: Run privileged Linux tests
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" PLEXD_TEST_REAL_NFTABLES=1 \
            "$(command -v go)" test -race -count=1 -v -run '^TestNftablesController_Real(Traffic|ConnLog)?$' ./internal/policy/ \
            | tee "$RUNNER_TEMP/real-nftables.txt"
          grep -q -- '--- PASS: TestNftablesController_Real ' "$RUNNER_TEMP/real-nftables.txt"
          grep -q -- '--- PASS: TestNftablesController_RealTraffic ' "$RUNNER_TEMP/real-nftables.txt"
          grep -q -- '--- PASS: TestNftablesController_RealConnLog ' "$RUNNER_TEMP/real-nftables.txt"
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" PLEXD_TEST_REAL_LINKS=1 \
            "$(command -v go)" test -race -count=1 -v -run '^(TestNetlinkVPNController_RealLinks|TestNetlinkRouteController_RealRoutes|TestRTTProbe_RealAnswersOnlyTheMeshInterface|TestSession_RealAcceptsOnlyMeshAndLocal|TestServer_RealAnswersNoOtherNetwork|TestNetlinkController_RealReplaceAddress)$' ./internal/bridge/ ./internal/wireguard/ ./internal/tunnel/ ./internal/meshdns/ \
            | tee "$RUNNER_TEMP/real-links.txt"
          grep -q -- '--- PASS: TestNetlinkVPNController_RealLinks ' "$RUNNER_TEMP/real-links.txt"
          grep -q -- '--- PASS: TestNetlinkRouteController_RealRoutes ' "$RUNNER_TEMP/real-links.txt"
          grep -q -- '--- PASS: TestRTTProbe_RealAnswersOnlyTheMeshInterface ' "$RUNNER_TEMP/real-links.txt"
          grep -q -- '--- PASS: TestSession_RealAcceptsOnlyMeshAndLocal ' "$RUNNER_TEMP/real-links.txt"
          grep -q -- '--- PASS: TestServer_RealAnswersNoOtherNetwork ' "$RUNNER_TEMP/real-links.txt"
          grep -q -- '--- PASS: TestNetlinkController_RealReplaceAddress ' "$RUNNER_TEMP/real-links.txt"

      # Creating a utun device needs root, and so do altering the routing table
      # and the forwarding sysctl, so the eleven macOS tests against the real
      # kernel skip in the unprivileged run above. The bridge controller test
      # creates its utuns through the bridge controllers and routes over them.
      # The peer route test TestPeerRoutes_RealUTUN sets a WireGuard manager up
      # on a utun of its own and reads back the allowed IPs and the route a
      # peer's routed subnet gets; it is the only proof that macOS accepts the
      # peer routes, so the step also fails unless its PASS line is in the
      # output. The address test TestDarwinController_RealReplaceAddress
      # replaces the address of a utun of its own and repeats the call; it is
      # the only proof that ifconfig removes an alias with -alias and that the
      # routes through the utun, which keep the removed alias, give a socket
      # the new address once ReplaceAddress has pointed them at it, so the
      # step also fails unless its PASS line is in the output.
      # Loading a pf anchor and taking a pf enable reference need root as well;
      # the four pf tests also ask for PLEXD_TEST_REAL_PF, so sudo go test
      # ./... on a developer's Mac leaves the host's pf alone. The pf traffic
      # test TestPFController_RealTraffic and the connection-log test
      # TestPFController_RealConnLog each create a utun of their own and send
      # traffic through it, under rules that name that utun alone. The mesh
      # source rewrite test TestPFController_RealMeshSourceRewrite creates a
      # mesh utun and a provider's and a tunnel's utun beside it, switches
      # net.inet.ip.forwarding on and restores it, and forwards packets
      # between them through the rewrite's pf lines. The
      # connection-log test creates pflog0 when the host has none and reads it
      # through a BPF device, which needs root too. The absolute go path is
      # resolved before sudo resets PATH, and the two cache variables let root
      # reuse what the step above downloaded and built instead of filling a
      # second cache under /var/root. -v is what makes a skip visible in the log
      # rather than passing as a bare ok. The two session helper tests start a
      # shell as uid 65534 and hand it the pty, which needs root as well; they
      # skip on every other runner, so this is where the switch of users is
      # exercised. The mesh DNS registrar test writes configd's dynamic store
      # and resolves through mDNSResponder over a real utun, which changes the
      # host's resolver configuration while it runs; it also asks for
      # PLEXD_TEST_REAL_RESOLVER, so sudo go test ./... on a developer's Mac
      # leaves their resolver alone. The pf traffic test is the only proof of
      # what a Mac's pf lines let out and back in, the connection-log test the
      # only proof of how pf numbers and logs plexd's logged lines, and the
      # mesh source rewrite test the only proof that a tag set on the way in
      # reaches the nat line on the way out and that nat pass skips the
      # filter rules, so the step also fails unless all three PASS lines are
      # in the output: a skip would pass otherwise.
      # The tcp session listener test TestSession_RealUTUN and the probe test
      # TestRTTProbe_RealUTUN each create a mesh utun and a utun for another
      # network, switch net.inet.ip.forwarding on and restore it, and write
      # packets into the utuns. They prove that a listener bound with
      # IP_BOUND_IF answers into the mesh only, and that the probe drops what
      # did not arrive on the mesh utun. They ask for PLEXD_TEST_REAL_LINKS, so
      # sudo go test ./... on a developer's Mac skips them. They
      # run in a command of their own with -p 1, after the first command
      # finished, because both switch the host's one forwarding knob and
      # restore it, as TestDarwinRouteController_Real and
      # TestPFController_RealMeshSourceRewrite in the first command also do.
      # Two test processes that restore it at different times would switch it
      # off under each other. The step fails unless both PASS lines are in
      # that command's output.
      - name: Run privileged macOS tests
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            PLEXD_TEST_REAL_PF=1 PLEXD_TEST_REAL_RESOLVER=1 \
            "$(command -v go)" test -race -count=1 -v \
            -run '^(TestDarwinController_RealUTUN|TestDarwinController_RealReplaceAddress|TestDarwinRouteController_Real|TestPFController_Real|TestPFController_RealTraffic|TestPFController_RealConnLog|TestPFController_RealMeshSourceRewrite|TestWGControllers_RealUTUN|TestPeerRoutes_RealUTUN|TestSessionHelper_PTYBelongsToLoginUser|TestSessionHelper_RefusedPTYKeepsItsOwner|TestScutilRegistrar_Real)$' \
            ./internal/wireguard/ ./internal/bridge/ ./internal/policy/ ./internal/tunnel/ ./internal/meshdns/ \
            | tee "$RUNNER_TEMP/real-darwin.txt"
          grep -q -- '--- PASS: TestPFController_RealTraffic ' "$RUNNER_TEMP/real-darwin.txt"
          grep -q -- '--- PASS: TestPFController_RealConnLog ' "$RUNNER_TEMP/real-darwin.txt"
          grep -q -- '--- PASS: TestPFController_RealMeshSourceRewrite ' "$RUNNER_TEMP/real-darwin.txt"
          grep -q -- '--- PASS: TestPeerRoutes_RealUTUN ' "$RUNNER_TEMP/real-darwin.txt"
          grep -q -- '--- PASS: TestDarwinController_RealReplaceAddress ' "$RUNNER_TEMP/real-darwin.txt"
          sudo env GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" PLEXD_TEST_REAL_LINKS=1 \
            "$(command -v go)" test -race -count=1 -v -p 1 -run '^(TestSession_RealUTUN|TestRTTProbe_RealUTUN)$' ./internal/tunnel/ ./internal/wireguard/ \
            | tee "$RUNNER_TEMP/real-darwin-links.txt"
          grep -q -- '--- PASS: TestSession_RealUTUN ' "$RUNNER_TEMP/real-darwin-links.txt"
          grep -q -- '--- PASS: TestRTTProbe_RealUTUN ' "$RUNNER_TEMP/real-darwin-links.txt"

      # Creating a Wintun adapter needs the driver DLL and Administrator. The
      # Windows runner is already elevated, so the gate is this variable rather
      # than the privilege check: without one the four tests, the controller's
      # two, the bridge controllers' and the peer route test, would also run
      # inside the ordinary step above and create real adapters there. The
      # tests write the embedded wintun.dll beside their own binaries, so
      # nothing has to be fetched. The peer route test TestPeerRoutes_RealWintun
      # also alters the routing table, so it asks for PLEXD_TEST_REAL_ROUTES as
      # well. It is the only proof that Windows accepts the peer routes, so the
      # step fails unless its PASS line is in the output: a skip would pass
      # otherwise. The address test TestWindowsController_RealReplaceAddress
      # adds a route through its adapter and asks for both variables too. It
      # replaces the adapter's address and repeats the call, and it is the
      # only proof that the routes through the adapter stay when the old
      # address goes and that Windows answers ERROR_INVALID_PARAMETER for an
      # address the adapter does not hold, so the step also fails unless its
      # PASS line is in the output.
      - name: Run real Wintun tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WINTUN: '1'
          PLEXD_TEST_REAL_ROUTES: '1'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'real-wintun.txt'
          go test -race -count=1 -v -run '^(TestWindowsController_RealWintun|TestWindowsController_RealReplaceAddress|TestWGControllers_RealWintun|TestPeerRoutes_RealWintun)$' ./internal/wireguard/ ./internal/bridge/ | Tee-Object -FilePath $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern '--- PASS: TestPeerRoutes_RealWintun ')) {
            Write-Error 'TestPeerRoutes_RealWintun did not pass'
            exit 1
          }
          if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern '--- PASS: TestWindowsController_RealReplaceAddress ')) {
            Write-Error 'TestWindowsController_RealReplaceAddress did not pass'
            exit 1
          }

      # Adding a route and toggling an adapter's forwarding flag need
      # Administrator. The runner has it, so the gate is this variable for the
      # same reason as above: without one the test would alter the runner's
      # routing table from inside the ordinary step.
      - name: Run real route tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_ROUTES: '1'
        run: >-
          go test -race -count=1 -v
          -run '^TestWindowsRouteController_Real$' ./internal/bridge/

      # Programming the filter engine and creating a NetNat object need
      # Administrator. The runner has it, so the gate is this variable for the
      # same reason as above: without one the tests would install real filters
      # inside the ordinary step. The NAT test uses a prefix no adapter carries.
      # The NAT exemption test TestWFPController_RealNATExemption creates two
      # Wintun adapters of its own, checks the exemption object of one beside
      # the object AddNATMasquerade makes for the other's prefix, and removes
      # every object it made.
      # The traffic test TestWFPController_RealTraffic and the connection-log
      # test TestWFPController_RealConnLog each create a Wintun adapter and
      # inject unsolicited packets into it, which the Windows Firewall would
      # block on its own, so the step turns every firewall profile off first.
      # plexd's filters live in a sublayer of their own and do not depend on
      # the Windows Firewall. The connection-log test turns on the filter
      # engine's classify-allow net events, a setting of the whole host that
      # outlives the process, and checks that the controller puts the host's
      # setting back, also after a simulated crash. The traffic test is the
      # only proof of what plexd's filters let out and back in on Windows, the
      # connection-log test the only proof that the engine reports what
      # plexd's logged filters permit, and the NAT exemption test checks every
      # object an exemption leaves in the host's WinNAT, so the step fails
      # unless all three PASS lines are in the output: a skip would pass
      # otherwise.
      - name: Run real WFP tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WFP: '1'
        run: |
          Set-NetFirewallProfile -All -Enabled False
          $out = Join-Path $env:RUNNER_TEMP 'real-wfp.txt'
          go test -race -count=1 -v -run '^TestWFPController_Real(NAT|NATExemption|Traffic|ConnLog)?$' ./internal/policy/ | Tee-Object -FilePath $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern '--- PASS: TestWFPController_RealTraffic ')) {
            Write-Error 'TestWFPController_RealTraffic did not pass'
            exit 1
          }
          if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern '--- PASS: TestWFPController_RealConnLog ')) {
            Write-Error 'TestWFPController_RealConnLog did not pass'
            exit 1
          }
          if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern '--- PASS: TestWFPController_RealNATExemption ')) {
            Write-Error 'TestWFPController_RealNATExemption did not pass'
            exit 1
          }

      # The mesh source rewrite test creates three Wintun adapters through the
      # bridge's own controllers, the mesh adapter, a user access provider's
      # and a site-to-site tunnel's, and drives WireGuard traffic between them
      # and three wireguard-go devices of its own. It also adds a route to the
      # tunnel's adapter, switches the adapters' forwarding flags on, applies a
      # WFP chain on the mesh adapter and creates the bridge NAT's NetNat
      # object and the tunnel's exemption object, so it needs all three
      # variables of the steps above. Its echo socket on the provider's address
      # takes unsolicited inbound UDP, which the Windows Firewall would block
      # on its own, so the step turns every firewall profile off itself rather
      # than rely on the WFP step before it. Its NetNat objects carry the names
      # the WFP step's NAT tests use, and the test refuses to start beside an
      # object of those names, so the two stay in steps of their own. The test
      # is the only proof of the in-process mesh source rewrite and of the
      # tunnel's NAT exemption on Windows, so the step fails unless its PASS
      # line is in the output: a skip would pass otherwise.
      - name: Run real mesh source rewrite tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_WINTUN: '1'
          PLEXD_TEST_REAL_ROUTES: '1'
          PLEXD_TEST_REAL_WFP: '1'
        run: |
          Set-NetFirewallProfile -All -Enabled False
          $out = Join-Path $env:RUNNER_TEMP 'real-meshrewrite.txt'
          go test -race -count=1 -v -run '^TestMeshSourceRewrite_RealWintun$' ./internal/bridge/ | Tee-Object -FilePath $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern '--- PASS: TestMeshSourceRewrite_RealWintun ')) {
            Write-Error 'TestMeshSourceRewrite_RealWintun did not pass'
            exit 1
          }

      # The mesh DNS registrar test writes Name Resolution Policy Table rules,
      # the search list of a Wintun adapter and the Group Policy key, refreshes
      # machine policy and binds 127.0.0.1:53, which changes the runner's
      # resolver configuration while it runs. The runner has Administrator, so
      # the gate is this variable for the same reason as above: without one the
      # test would do all that inside the ordinary step. It waits up to 180
      # seconds each time the Group Policy store decides, so its timeout is
      # above go test's default of 10 minutes. It runs as LocalSystem, as
      # plexd's service does, through a scheduled task, because the DNS Client
      # reads the Group Policy store only after GenerateGPNotification, which
      # is measured to work for LocalSystem; the task does not inherit this
      # step's environment, so the variable is set in the script it runs. The
      # step prints the test's output as it grows and fails unless the test
      # passed: a skip would pass as well otherwise.
      - name: Run real resolver tests
        if: runner.os == 'Windows'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'meshdns.test.exe'
          $out = Join-Path $env:RUNNER_TEMP 'real-resolver.txt'
          $bat = Join-Path $env:RUNNER_TEMP 'real-resolver.cmd'
          go test -c -race -o $exe ./internal/meshdns/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath $bat -Encoding ascii -Value @(
            '@echo off',
            'set PLEXD_TEST_REAL_RESOLVER=1',
            "`"$exe`" -test.run=TestNRPTRegistrar_Real -test.v -test.timeout=15m > `"$out`" 2>&1",
            "echo TEST-EXIT %ERRORLEVEL% >> `"$out`""
          )
          $task = 'plexd-real-resolver-test'
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$bat`""
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          Register-ScheduledTask -TaskName $task -Action $action -Principal $principal | Out-Null
          Start-ScheduledTask -TaskName $task
          $printed = 0
          $exit = $null
          $deadline = (Get-Date).AddMinutes(17)
          while ($null -eq $exit -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $lines = @()
            try { $lines = @(Get-Content -LiteralPath $out -ErrorAction Stop) } catch { }
            if ($lines.Count -gt $printed) {
              $lines[$printed..($lines.Count - 1)] | ForEach-Object { Write-Host $_ }
              $printed = $lines.Count
            }
            $last = $lines | Where-Object { $_ -like 'TEST-EXIT *' } | Select-Object -Last 1
            if ($last) { $exit = [int](($last -replace '^TEST-EXIT', '').Trim()) }
          }
          Unregister-ScheduledTask -TaskName $task -Confirm:$false
          if ($null -eq $exit) { Write-Host 'the test did not finish within 17 minutes'; exit 1 }
          if ($exit -ne 0) { exit $exit }
          if (-not (Select-String -LiteralPath $out -SimpleMatch -Quiet -Pattern '--- PASS: TestNRPTRegistrar_Real')) {
            Write-Host 'TestNRPTRegistrar_Real did not pass'
            exit 1
          }

      # The Windows runner boots with runs of 100 neighbouring ports reserved
      # for TCP and others reserved for UDP, two side by side for each on most
      # boots. A bind inside a run fails with WSAEACCES, and on port 0 the
      # kernel still hands those numbers out to the protocol that did not
      # reserve them, one after the other. A pick that takes a kernel-chosen
      # UDP port and binds TCP on the same number met ten refused neighbours
      # in a row there. Two of the tests reserve 100 TCP ports of their own,
      # move the kernel's UDP pick to them and ask the mesh DNS server, the
      # fake resolver of its tests and the mock API's DNS stub for port 0.
      # A fixed port fails the same way on a boot that reserved it: the peer
      # route test TestPeerRoutes_RealWintun was refused on UDP port 51994.
      # The third test reserves 100 UDP ports of its own, moves the kernel's
      # UDP pick to the port before them and runs the peer route test, which
      # takes its listen port from the kernel, so it also asks for the two
      # variables of the Wintun step.
      # Reserving ports needs Administrator, and a reservation outlives a
      # killed test and a reboot. The runner has Administrator, so the gate is
      # this variable for the same reason as above: without one the tests
      # would reserve ports inside the ordinary step. Every process of the
      # host shares the one UDP pick, so -p 1 runs the three packages one
      # after the other. The step fails unless all three tests passed: a skip
      # would pass as well otherwise.
      - name: Run real port reservation tests
        if: runner.os == 'Windows'
        env:
          PLEXD_TEST_REAL_PORT_RESERVATION: '1'
          PLEXD_TEST_REAL_WINTUN: '1'
          PLEXD_TEST_REAL_ROUTES: '1'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'real-ports.txt'
          go test -race -count=1 -p 1 -v -run '^(TestServer_ListenPortZeroAtReservedTCPPorts|TestDNSStub_ListenPortZeroAtReservedTCPPorts|TestPeerRoutes_RealWintunAtReservedUDPPorts)$' ./internal/meshdns/ ./test/e2e/mockapi/ ./internal/bridge/ | Tee-Object -FilePath $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'TestServer_ListenPortZeroAtReservedTCPPorts', 'TestDNSStub_ListenPortZeroAtReservedTCPPorts', 'TestPeerRoutes_RealWintunAtReservedUDPPorts') {
            if (-not (Select-String -Path $out -SimpleMatch -Quiet -Pattern "--- PASS: $name ")) {
              Write-Error "$name did not pass"
              exit 1
            }
          }

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Run integration tests
        run: go test -race -count=1 -run Integration ./...
